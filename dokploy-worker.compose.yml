services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_PACKAGE_SPEC: ${PYTHON_PACKAGE_SPEC:-}
    environment:
      APP_ROLE: worker
      COORDINATOR_URL: ${COORDINATOR_URL}
      WORKER_NAME: ${WORKER_NAME:-worker-1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      DISPATCH_WORKER_RESOURCES_JSON: ${DISPATCH_WORKER_RESOURCES_JSON:-}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      DISPATCH_DAGSTER_RUN_TIMEOUT_SECONDS: ${DISPATCH_DAGSTER_RUN_TIMEOUT_SECONDS:-21600}
      DISPATCH_HEARTBEAT_LOG_INTERVAL_MS: ${DISPATCH_HEARTBEAT_LOG_INTERVAL_MS:-60000}
      DISPATCH_RESULT_REPORT_MAX_ATTEMPTS: ${DISPATCH_RESULT_REPORT_MAX_ATTEMPTS:-5}
      DISPATCH_RESULT_REPORT_RETRY_BASE_MS: ${DISPATCH_RESULT_REPORT_RETRY_BASE_MS:-250}
      DISPATCH_WORKER_VERSION: ${DISPATCH_WORKER_VERSION:-0.1.0}
      PYTHON_ROOT: /app/python
      PYTHON_BIN: ${PYTHON_BIN:-/opt/dispatch-python/bin/python}
      DISPATCH_CALLABLE_ALLOWLIST_FILE: ${DISPATCH_CALLABLE_ALLOWLIST_FILE:-}
      DISPATCH_CALLABLE_ALLOWLIST_JSON: ${DISPATCH_CALLABLE_ALLOWLIST_JSON:-}
    restart: unless-stopped
    stop_grace_period: 60s
